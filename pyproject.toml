[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-risk-topology"
version = "0.1.0"
description = "Evaluates maligned AI tool-misuse risk from the topology of the toolkit (E1: static Property-3 analyzer)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jason Carpenter" }]
dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.19",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trt-analyze = "tool_risk_topology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tool_risk_topology = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
